name: Native debugger checks
on:
  push:
    paths:
      - 'downloads/dbg-local-v0.1.zip'
      - '.github/workflows/native-debugger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-gdb:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gdb
      - name: Extract the exact downloadable package
        run: |
          python -m zipfile -e downloads/dbg-local-v0.1.zip unpacked
          cp downloads/dbg-local-v0.1.zip unpacked/dbg-local/
      - name: Require native tools and run all Python checks
        run: |
          cd unpacked/dbg-local
          python -c "import shutil; assert shutil.which('gdb') and shutil.which('gcc')"
          python -m unittest discover -s tests -v
      - name: Browser behavior checks in both languages
        run: |
          cd unpacked/dbg-local
          node tests/file_open.test.cjs
          node tests/file_open.test.cjs --en
          node tests/workbench.test.cjs
          node tests/workbench.test.cjs --en
          node tests/inspector.test.cjs
          node tests/memory-tools.test.cjs
          node tests/advanced-ui.test.cjs
          node tests/advanced-ui.test.cjs --en
          node tests/ctf-ui.test.cjs
          node tests/ctf-ui.test.cjs --en
          node tests/public_debugger.test.cjs
          node tests/browser_cpu.test.cjs
          node tests/browser_storage.test.cjs
  linux-gdb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native GDB and GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb gcc
      - name: Extract the downloadable source
        run: |
          python -m zipfile -e downloads/dbg-local-v0.1.zip unpacked
          cp downloads/dbg-local-v0.1.zip unpacked/dbg-local/
      - name: Native ELF, PTY input and all Python checks
        working-directory: unpacked/dbg-local
        run: |
          python -c "import shutil; assert shutil.which('gdb') and shutil.which('gcc')"
          python -m unittest discover -s tests -v
      - name: Browser CPU and CTF controls
        working-directory: unpacked/dbg-local
        run: |
          node tests/browser_cpu.test.cjs
          node tests/browser_storage.test.cjs
          node tests/ctf-ui.test.cjs
          node tests/ctf-ui.test.cjs --en
          node tests/file_open.test.cjs
          node tests/file_open.test.cjs --en
